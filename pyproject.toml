[project]
name = "nekos-api"
version = "4.0.0"
description = "An open-source free anime images RESTful API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.4",
    "django-ninja>=1.3.0",
    "psycopg[binary,pool]>=3.2.3",
    "django-storages[s3]>=1.14.4",
    "python-dotenv>=1.0.1",
    "django-dynamic-filenames>=1.4.0",
    "pillow>=11.1.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "grequests>=0.7.0",
    "gunicorn>=23.0.0",
    "requests>=2.32.3",
]
